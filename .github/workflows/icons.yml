name: icons

on:
  push:
    paths:
      - "icons/**"
      - "tools/verify_icons.py"
      - ".github/workflows/icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify icons
        run: python tools/verify_icons.py icons
      - name: Build ZIP
        run: python tools/verify_icons.py icons --zip asgard-icons.zip
      - uses: actions/upload-artifact@v4
        with:
          name: asgard-icons
          path: asgard-icons.zip
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/icons-v')
        uses: softprops/action-gh-release@v2
        with:
          files: asgard-icons.zip
