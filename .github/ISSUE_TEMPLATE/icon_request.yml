name: 아이콘 요청
description: 빠진 아이템/버프 아이콘을 요청합니다.
title: "[icon] "
labels: ["icons"]
body:
  - type: input
    id: name
    attributes:
      label: 아이템/버프 이름
      placeholder: "예: 구운빵 / [HP/100만] R포션"
    validations:
      required: true
  - type: input
    id: iid
    attributes:
      label: 내부ID (IID)
      description: 앱의 아이템 목록 '내부ID' 열에서 확인할 수 있습니다.
      placeholder: "예: iFood06 / aFood06"
  - type: textarea
    id: shot
    attributes:
      label: 스크린샷
      description: 인벤토리/버프 아이콘을 드래그해서 올려주세요 (배경은 투명이 아니어도 됩니다).
  - type: textarea
    id: note
    attributes:
      label: 기타
      description: 서버/버전, 아이콘 크기 등 참고 사항
